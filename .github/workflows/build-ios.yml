name: Build iOS (iPhone & iPad)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (iOS 14.0+)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application and sync to iOS AppAssets
        run: npm run build:ios

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.2.app || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iOS Archive (Target: iOS 14.0)
        run: |
          xcodebuild archive \
            -project ios/AlgerMusicPlayer.xcodeproj \
            -scheme AlgerMusicPlayer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build-output/AlgerMusicPlayer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=14.0

      - name: Package Unsigned IPA
        run: |
          mkdir -p build-output/Payload
          cp -R build-output/AlgerMusicPlayer.xcarchive/Products/Applications/AlgerMusicPlayer.app build-output/Payload/
          cd build-output
          zip -qr AlgerMusicPlayer-iOS14.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlgerMusicPlayer-iOS14-IPA
          path: build-output/AlgerMusicPlayer-iOS14.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload xcarchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlgerMusicPlayer-xcarchive
          path: build-output/AlgerMusicPlayer.xcarchive
          if-no-files-found: error
          retention-days: 14
